services:
  app:
    build: .
    environment:
      ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://developer:developer@db:5432/developer?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@developer.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 2s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: developer
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: developer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d developer"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
