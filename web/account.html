<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | developer.dev</title>
  <link rel="icon" href="assets/figma/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css?v=2">
  <script src="script.js?v=2" defer></script>
</head>
<body><div class="site">
  <main class="app-page" id="main">
    <h1>Account</h1>
    <section id="account-login">
      <h2>Вход</h2>
      <form class="app-form" data-auth="login" method="post" action="/api/auth/login">
        <label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <button class="button" type="submit">Войти</button>
        <p class="app-status" data-status role="status"></p>
      </form>
      <p class="app-note">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </section>
    <section id="account-profile" hidden>
      <div id="account-content"></div>
      <h2>Корзина (<span id="cart-count">0</span>)</h2>
      <p class="app-note">Корзина сохраняется в этом браузере. Покупка спишет количество услуг из доступного остатка. Реальная оплата не выполняется.</p>
      <div class="app-table-wrap" id="cart-content"></div>
      <p class="app-price" id="cart-total"></p>
      <div class="app-toolbar">
        <a class="button" href="services.html">Продолжить выбор</a>
        <button class="button" id="clear-cart" type="button">Очистить корзину</button>
        <button class="button" id="buy" type="button" disabled>Купить</button>
      </div>
      <p class="app-status" id="purchase-status" role="status"></p>
    </section>
    <p class="app-status" id="page-status" role="status"></p>
  </main>
</div></body>
</html>
